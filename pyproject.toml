[project]
name = "netops-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "s4ge", email = "shrey.sneh650@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.0",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.21",
    "langgraph-checkpoint>=4.3.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
netops-agent = "netops_agent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
